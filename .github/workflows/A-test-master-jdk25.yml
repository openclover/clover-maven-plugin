name: A Test master on JDK25

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      commitHash:
        description: 'Commit'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      if: inputs.commitHash == ''

    - uses: actions/checkout@v7
      if: inputs.commitHash != ''
      with:
        ref: '${{ inputs.commitHash }}'
      
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: 25
        distribution: temurin
        cache: maven

    - name: Run basic tests and install artifacts locally
      run: mvn -B -ntp clean install

    - name: Run integration tests
      run: mvn -B -ntp clean verify -Pintegration-tests

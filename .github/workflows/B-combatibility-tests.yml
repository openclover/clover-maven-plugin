name: B Maven Compatibility Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test-matrix:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        maven: [ 3.3.1, 3.9.2, 4.0.0-rc-5 ]

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - name: Set up Maven ${{ matrix.maven }}
        run: |
          # dlcdn hosts current releases and pre-releases (e.g. rc); archive hosts everything
          # older (e.g. 3.3.1) but not pre-releases. Try dlcdn first, then fall back to archive.
          REL_PATH="maven-${MV%%.*}/${MV}/binaries/apache-maven-${MV}-bin.tar.gz"
          curl -fsSL "https://dlcdn.apache.org/maven/${REL_PATH}" -o /tmp/maven.tar.gz \
            || curl -fsSL "https://archive.apache.org/dist/maven/${REL_PATH}" -o /tmp/maven.tar.gz
          tar xzf /tmp/maven.tar.gz -C "$HOME"
          echo "$HOME/apache-maven-${MV}/bin" >> "$GITHUB_PATH"
        env:
          MV: ${{ matrix.maven }}

      - name: Run tests
        run: |
          # --no-transfer-progress (-ntp) was added in Maven 3.6.1; older versions reject it
          NTP="-ntp"
          case "${{ matrix.maven }}" in
            3.0.*|3.1.*|3.2.*|3.3.*|3.4.*|3.5.*|3.6.0) NTP="" ;;
          esac
          # 'clover:instrument' forks a build lifecycle and works on Maven 3 only, so its integration
          # tests live in a separate profile which we activate for Maven 3 versions only
          PROFILES="integration-tests"
          case "${{ matrix.maven }}" in
            3.*) PROFILES="integration-tests,integration-tests-maven3" ;;
          esac
          mvn -version
          mvn -B $NTP clean verify -P"$PROFILES"

      - name: Collect integration test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: it-build-logs-maven-${{ matrix.maven }}
          path: |
            target/it/**/build.log
            target/it/**/surefire-reports/*.txt
          if-no-files-found: ignore
          retention-days: 14

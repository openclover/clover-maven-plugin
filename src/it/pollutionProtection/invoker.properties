# Repository pollution protection combined with the 'clover:setup' goal. Runs on Maven 3 and Maven 4.
# The 'clover:instrument' cases live in the 'pollutionProtectionInstrument' IT (Maven 3 only).
#
# Note: since 5.1.0 'maven.clover.repositoryPollutionProtection' defaults to true; it is passed
# explicitly below so that this test keeps documenting the intent.

####################
# clean life cycle
####################

# should pass
invoker.goals    = clean clover:setup       -Dmaven.clover.repositoryPollutionProtection=true
invoker.buildResult = success

####################
# default life cycle
####################

# clover:setup with no install/deploy; should pass
invoker.goals.2  = clean clover:setup test                 -Dmaven.clover.repositoryPollutionProtection=true
invoker.buildResult.2 = success

invoker.goals.3  = clean clover:setup verify               -Dmaven.clover.repositoryPollutionProtection=true
invoker.buildResult.3 = success

invoker.goals.4  = clean clover:setup help:effective-pom   -Dmaven.clover.repositoryPollutionProtection=true
invoker.buildResult.4 = success

# clover:setup with install/deploy (also implicit); should fail
invoker.goals.5 = clean clover:setup install               -Dmaven.clover.repositoryPollutionProtection=true
invoker.buildResult.5 = failure

invoker.goals.6 = clean clover:setup deploy -Dmaven.deploy.skip=true -Dmaven.clover.repositoryPollutionProtection=true
invoker.buildResult.6 = failure

# the protection is now enabled by default - the same build must fail without the explicit flag
invoker.goals.7 = clean clover:setup install
invoker.buildResult.7 = failure

# ...and pass when it is explicitly disabled
invoker.goals.8 = clean clover:setup install -Dmaven.clover.repositoryPollutionProtection=false
invoker.buildResult.8 = success

# NOTE: the '-Pwith-fork' case (a plugin forking a build cycle which runs up to the 'install' phase) is not
# listed here - it requires the 'fork-maven-plugin' sample to be installed first, see 'pollutionProtectionCycles'.

####################
# site life cycle
####################

invoker.goals.10 = clean clover:setup site -Dmaven.clover.repositoryPollutionProtection=true
invoker.buildResult.10 = success

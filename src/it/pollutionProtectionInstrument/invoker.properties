# Repository pollution protection combined with the 'clover:instrument' goal.
# NOTE: 'clover:instrument' forks a build lifecycle and works on Maven 3 only, therefore this IT is
# executed by the 'integration-tests-maven3' profile of the plugin build. The 'clover:setup' cases live
# in the 'pollutionProtection' IT, which runs on both Maven 3 and Maven 4.

####################
# clean life cycle
####################

invoker.goals    = clean clover:instrument  -Dmaven.clover.repositoryPollutionProtection=true
invoker.buildResult = success

####################
# default life cycle
####################

# clover:instr with install/deploy; should pass as we have own build cycle
invoker.goals.2  = clean clover:instrument install         -Dmaven.clover.repositoryPollutionProtection=true
invoker.buildResult.2 = success

invoker.goals.3  = clean clover:instrument deploy -Dmaven.deploy.skip=true -Dmaven.clover.repositoryPollutionProtection=true
invoker.buildResult.3 = success

# clover:instr with install/deploy and no clover classifier; should fail as we use orignal artifacts' names
invoker.goals.4  = clean clover:instrument install -Dmaven.clover.useCloverClassifier=false -Dmaven.clover.repositoryPollutionProtection=true
invoker.buildResult.4 = failure

invoker.goals.5  = clean clover:instrument deploy -Dmaven.deploy.skip=true -Dmaven.clover.useCloverClassifier=false -Dmaven.clover.repositoryPollutionProtection=true
invoker.buildResult.5 = failure

####################
# site life cycle
####################

invoker.goals.6 = clean clover:instrument site -Dmaven.clover.repositoryPollutionProtection=true
invoker.buildResult.6 = success

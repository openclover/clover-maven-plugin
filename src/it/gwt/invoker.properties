invoker.profiles = with.clover.serveronly

# GWT 2.13.1 is compiled for Java 11 (class-file version 55) and its tooling throws
# UnsupportedClassVersionError on Java 8 - GWT dropped Java 8 support at 2.11+. Run this IT on JDK 11+
# only; on JDK 8 the invoker skips it (reported as skipped, not failed).
invoker.java.version = 11+

invoker.goals = clean verify

# goals.txt is not honoured by maven-invoker-plugin 3.x; drive the goals explicitly.
# Use the forked 'instrument-test' lifecycle (instruments main AND test sources, forks up to the
# 'test' phase and does NOT install), so both modules must resolve their inter-module dependencies
# (moduleA main jar and moduleA test-jar) from the reactor's freshly instrumented classes.
invoker.goals = clean clover:instrument-test clover:clover verifier:verify
